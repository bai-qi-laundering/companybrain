services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: companybrain
      POSTGRES_USER: companybrain
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請先填寫 .env 的 DB_PASSWORD}
    volumes:
      - companybrain-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companybrain -d companybrain"]
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8788
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: companybrain
      PGUSER: companybrain
      PGPASSWORD: ${DB_PASSWORD:?請先填寫 DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?請先填寫 ADMIN_PASSWORD}
      LINE_ACCESS_MODE: ${LINE_ACCESS_MODE:-friends}
      LINE_REMINDERS_ENABLED: ${LINE_REMINDERS_ENABLED:-true}
      LINE_REMINDER_HOUR: ${LINE_REMINDER_HOUR:-8}
      LINE_PUSH_FALLBACK: ${LINE_PUSH_FALLBACK:-true}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_ALLOWED_USER_IDS: ${LINE_ALLOWED_USER_IDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?請先填寫 PUBLIC_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  companybrain-db:
