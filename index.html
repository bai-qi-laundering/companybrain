</style></head><body><aside><div class="brand"><span class="seal">CM</span><div><strong>公司往來管理</strong><div class="eyebrow">RELATIONSHIP MANAGEMENT</div></div></div><nav aria-label="主要導覽"><button data-view="home" class="active">▦ <span>管理總覽</span></button><button data-view="directory">▤ <span>對象名錄</span></button><button data-view="records">◷ <span>往來紀錄</span></button><button data-view="reminders">♧ <span>待辦事項</span></button></nav><div class="aside-foot">客戶與合作夥伴資料<br><span class="badge" style="margin-top:15px">前端體驗版</span></div></aside><main><header><span class="mobile-brand">公司往來管理</span><label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="搜尋對象、聯絡人或紀錄" aria-label="搜尋對象、聯絡人或紀錄"></label><span class="date" id="today"></span></header><div id="connection-bar" class="connection-bar"></div><div id="sync-error" role="alert"></div><div id="content"></div></main><dialog id="record-dialog"><div class="dialog-head"><h2 id="form-title">新增往來紀錄</h2><button type="button" id="close-dialog" aria-label="關閉">×</button></div><form id="record-form"><div class="form-grid"><label>合作對象<select name="org" id="org-select" required></select></label><label>開始日期<input name="date" type="date" required></label><label>結束日期（選填）<input name="endDate" type="date"></label><label>紀錄類型<select name="type"><option>客訴</option><option>人情往來</option><option>會議</option><option>報價</option><option>一般紀錄</option><option>出差／展覽</option><option>公司事項</option><option>人事</option></select></label><label>金額（元，可留空）<input name="amount" type="number" min="0" step="0.01"></label><label>關聯對象（選填）<select name="relatedOrg" id="related-org-select"></select></label><label class="wide">事項<input name="title" maxlength="120" required placeholder="例如：中秋月餅採購"></label><label class="wide">詳細內容<textarea name="note" placeholder="數量、單價、處理結果、對方的交代…"></textarea></label></div><p class="note">試用紀錄僅保留於這台裝置，尚未同步 NAS。</p><div class="actions"><button type="button" class="outline" id="cancel-dialog">取消</button><button class="primary" type="submit">儲存紀錄</button></div></form></dialog><dialog id="task-dialog"><div class="dialog-head"><h2 id="task-form-title">新增待辦</h2><button type="button" id="close-task" aria-label="關閉待辦表單">×</button></div><form id="task-form"><div class="form-grid"><label class="wide">待辦事項<input name="title" required maxlength="120" placeholder="例如：確認設備報價明細"></label><label>待辦日期（選填）<input type="date" name="dueDate"></label><label>關聯對象（選填）<select name="org" id="task-org-select"></select></label><label class="wide">備註<textarea name="note" placeholder="待確認的內容、處理方式…"></textarea></label></div><p class="note">目前儲存於本裝置；尚未啟用 NAS 同步或自動通知。</p><div class="actions"><button type="button" id="cancel-task" class="outline">取消</button><button type="submit" class="primary">儲存待辦</button></div></form></dialog>
<dialog id="login-dialog"><div class="dialog-head"><h2>公司資料登入</h2></div><form id="login-form"><label>帳號<input name="username" autocomplete="username" value="admin1" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="login-error" role="alert"></p><div class="actions"><button class="primary" type="submit">登入</button></div></form></dialog>
<dialog id="ai-dialog"><div class="dialog-head"><h2>AI 整理紀錄</h2><button id="close-ai" aria-label="關閉">×</button></div><form id="ai-form"><label>交代內容<textarea name="text" required maxlength="8000" placeholder="例如：2026/09/20–09/23 上海出差，參加洗滌展，搭華航商務艙。"></textarea></label><p class="ai-mode-note">一般紀錄與待辦會整理後直接存入 NAS；有疑問時請你補填。內容會傳送至 Gemini。</p><button class="primary" type="submit">整理並儲存</button></form><div id="ai-result" class="ai-output" role="status" hidden></div><div class="actions"><button class="primary" id="use-ai-draft" hidden>填入新增表單</button></div></dialog>
<dialog id="org-dialog"><div class="dialog-head"><h2 id="org-form-title">新增對象</h2><button id="close-org" aria-label="關閉">×</button></div><form id="org-form"><div class="form-grid"><label>名稱<input name="name" required maxlength="100"></label><label>類別<select name="kind"><option>飯店</option><option>設備商</option><option>工程／建築</option><option>其他</option><option>內部</option></select></label><label>主要聯絡人<input name="contact" maxlength="100"></label><label>聯絡人職務<input name="role" maxlength="100"></label><label>經理／負責人<input name="manager" maxlength="100"></label><label>合約期間<input name="contract" maxlength="100" placeholder="2026/01/01–2028/12/31"></label><label>合約到期日（提醒用）<input name="contractEndDate" type="date"></label><label class="wide">備註<textarea name="memo" maxlength="2000"></textarea></label><label class="wide">目前價格（每行：品項,單價,生效日）<textarea name="prices" placeholder="浴巾,18,2026-10-01"></textarea></label></div><div class="actions"><button type="submit" class="primary">儲存對象</button></div></form></dialog>
<dialog id="question-dialog"><div class="dialog-head"><h2>詢問公司記憶庫</h2><button type="button" id="close-question" aria-label="關閉">×</button></div><form id="question-form"><label>想查什麼？<textarea name="text" required maxlength="8000" placeholder="例如：日航今年有哪些客訴？"></textarea></label><p class="note">先搜尋已儲存資料，再整理回答；引用可開啟原始紀錄。</p><div class="actions"><button class="primary" type="submit">查詢</button></div></form><div id="question-result" class="ai-output" hidden role="status"></div></dialog><input id="import-file" type="file" accept="application/json,.json" hidden>

function newId(){const c=globalThis.crypto;if(typeof c?.randomUUID==='function')return c.randomUUID();if(typeof c?.getRandomValues!=='function')throw new Error('此瀏覽器無法產生紀錄編號，請更新瀏覽器');const bytes=c.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}

function calendarHTML(){const [year,month]=calendarMonth.split('-').map(Number),first=new Date(Date.UTC(year,month-1,1)).getUTCDay(),days=new Date(Date.UTC(year,month,0)).getUTCDate();const counts={};tasks.filter(t=>!t.done&&t.dueDate&&taskMatches(t)).forEach(t=>counts[t.dueDate]=(counts[t.dueDate]||0)+1);return `<div class="calendar-head"><button data-month="-1" aria-label="上一個月">上一月</button><h2>${year} 年 ${month} 月</h2><button data-month="1" aria-label="下一個月">下一月</button></div><div class="calendar-grid">${['日','一','二','三','四','五','六'].map(w=>`<div class="weekday">${w}</div>`).join('')}${'<div class="calendar-empty" aria-hidden="true"></div>'.repeat(first)}${Array.from({length:days},(_,i)=>{const d=calendarMonth+'-'+String(i+1).padStart(2,'0'),n=counts[d]||0;return `<button class="calendar-day ${d===today?'today':''} ${n?'has-task':''} ${d===selectedDay?'selected':''}" data-day="${d}" aria-pressed="${d===selectedDay}" aria-label="${d}，${n} 件未完成待辦">${i+1}${n?`<span class="task-count">${n}</span>`:''}</button>`}).join('')}</div><div class="calendar-legend"><span><i class="legend-square"></i>有未完成待辦</span><button class="task-clear" data-today>回到本月</button></div><p class="note">點選日期查看當天待辦；未指定日期的事項列在全部日期清單。</p>`}

async function api(path,method='GET',data){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path.startsWith('/api/ai/')?120000:30000);let r;try{r=await fetch(path,{signal:controller.signal,method,credentials:'same-origin',headers:{'Content-Type':'application/json',...(nasCsrf?{'X-CSRF-Token':nasCsrf}:{})},...(data!==undefined?{body:JSON.stringify(data)}:{})});}catch(error){throw new Error(error.name==='AbortError'?'連線逾時，請確認 NAS 與網路狀態後重試。': '無法連線到 NAS，請確認網路後重試。')}finally{clearTimeout(timer)}let result;try{result=await r.json()}catch{throw new Error('服務回應不正確，請確認這是 NAS 網址')}if(!r.ok){if(r.status===401&&path!=='/api/login'){nasReady=false;showLogin()}throw new Error(result.error||'操作失敗')}return result}

$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>3*1024*1024)throw new Error('匯入檔案不能超過3MB');const data=JSON.parse(await file.text());if(!Array.isArray(data.organizations)||!Array.isArray(data.records)||!Array.isArray(data.tasks))throw new Error('不是有效的公司資料匯出檔');const nextOrg=[...organizations],map=new Map();for(const o of data.organizations){const match=nextOrg.find(x=>x.id===o.id||x.name===o.name);if(match){if(match.id===o.id&&match.name!==o.name)throw new Error('對象 ID 衝突，請先確認：'+o.name);map.set(o.id,match.id)}else{nextOrg.push(o);map.set(o.id,o.id)}}function merge(current,incoming){const next=[...current];for(const item of incoming){const r={...item,org:map.get(item.org)||item.org,relatedOrg:map.get(item.relatedOrg)||item.relatedOrg};const old=next.find(x=>x.id===r.id);if(!old)next.push(r);else if(JSON.stringify(old)!==JSON.stringify(r))throw new Error('同一筆 ID 的內容不同，未覆蓋，請先確認匯入檔')}return next}if(!confirm(`匯入 ${data.records.length} 筆紀錄與 ${data.tasks.length} 件待辦？現有資料將保留。`))return;await persistState({organizations:nextOrg,records:merge(records,data.records),tasks:merge(tasks,data.tasks)});render();notify('匯入完成')}catch(err){setSyncError(err.message)}finally{e.target.value=''}});

$('#close-org').onclick=()=>$('#org-dialog').close();$('#org-form').onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;try{const d=new FormData(f),name=d.get('name').trim();if(!name)throw new Error('請填名稱');if(organizations.some(o=>o.id!==editingOrg&&o.name===name))throw new Error('這個名稱已有檔案');const prices=d.get('prices').trim()?d.get('prices').trim().split('\n').map(line=>{const [item,amount,date,...extra]=line.split(',').map(x=>x.trim());if(!item||!amount||!Number.isFinite(Number(amount))||Number(amount)<0||!date||extra.length)throw new Error('價格請按「品項,單價,生效日」填写');return [item,Number(amount),date]}):[];const o={...(organizations.find(x=>x.id===editingOrg)||{}),contractEndDate:f.elements.contractEndDate.value||null,id:editingOrg||newId(),name,kind:d.get('kind'),mark:name.slice(0,1),en:'COMPANY · RELATIONSHIP',contact:d.get('contact').trim()||'尚未提供',role:d.get('role').trim()||'窗口',manager:d.get('manager').trim()||'尚未提供',contract:d.get('contract').trim()||'尚未提供',memo:d.get('memo').trim(),prices};await persistState({organizations:editingOrg?organizations.map(x=>x.id===editingOrg?o:x):[...organizations,o]});$('#org-dialog').close();render();notify('對象已儲存')}catch(err){notify(err.message)}};
async function startNas(){if(!nasMode){try{const saved=JSON.parse(localStorage.getItem('company-memory-organizations-v1'));if(Array.isArray(saved)&&saved.every(o=>o&&typeof o.id==='string'&&typeof o.name==='string'))organizations=saved}catch{}render();renderConnection();return}organizations=[];records=[];tasks=[];render();renderConnection();try{const session=await api('/api/session');nasCsrf=session.csrf;await refreshNas()}catch{showLogin()}setInterval(()=>{if(nasReady&&!nasBusy&&!document.querySelector('dialog[open]'))refreshNas().catch(e=>setSyncError(e.message))},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&nasReady&&!document.querySelector('dialog[open]'))refreshNas().catch(e=>setSyncError(e.message))})}
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function getRecords(id){return records.filter(r=>(!id||r.org===id||r.relatedOrg===id)&&[r.title,r.note,r.type,org(r.org)?.name,org(r.relatedOrg)?.name].join(' ').toLowerCase().includes(query())).sort((a,b)=>b.date.localeCompare(a.date))}
$('#close-question').onclick=()=>$('#question-dialog').close();
$('#question-form').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button'),out=$('#question-result');if(b.disabled)return;b.disabled=true;out.hidden=false;out.textContent='正在搜尋公司資料…';try{const r=await api('/api/ai/question','POST',{text:f.elements.text.value});out.textContent=r.answer;if(r.sources?.length){const list=document.createElement('div');for(const x of r.sources){const a=document.createElement('a');a.href=x.url;a.textContent=(x.date?x.date+' ':'')+x.title;a.style.display='block';a.style.marginTop='10px';list.appendChild(a);}out.appendChild(list);}}catch(err){out.textContent=err.message;}finally{b.disabled=false}};
function attachmentsHTML(r){if(!r.attachments?.length)return '';return '<div class="attachments">'+r.attachments.map(a=>{const u='/api/files/'+encodeURIComponent(a.id);if(!nasMode)return '<p class="note">附件需從 NAS 登入查看。</p>';return a.mime.startsWith('image/')?'<a href="'+u+'" target="_blank" rel="noopener"><img loading="lazy" src="'+u+'" alt="'+esc(a.name)+'" style="max-width:160px;max-height:120px;object-fit:contain;border:1px solid var(--line);margin:8px 8px 0 0"></a>':'<div style="margin-top:10px"><small>'+esc(a.name)+'</small><audio controls preload="none" src="'+u+'" style="display:block;max-width:100%"></audio></div>';}).join('')+'</div>';}

function eventHTML(r){return `<article class="event" id="record-${esc(r.id)}"><time datetime="${esc(r.date)}">${esc(r.date.slice(5).replace('-','/'))}${r.endDate?' — '+esc(r.endDate.slice(5).replace('-','/')):''}<div class="eyebrow">${esc(r.date.slice(0,4))}</div></time><div class="event-body"><span class="badge">${esc(r.type)}</span><h3 style="margin-top:7px">${esc(r.title)}</h3><p>${esc(org(r.org)?.name)}${r.relatedOrg?' · 關聯：'+esc(org(r.relatedOrg)?.name):''}${r.amount!=null?' · '+money(r.amount):''}</p><p>${esc(r.note)}</p>${r.createdByName?`<p>提交人：${esc(r.createdByName)}</p>`:''}${attachmentsHTML(r)}<button data-edit="${esc(r.id)}">編輯紀錄</button></div></article>`}
function orgHTML(o){return `<button class="org" data-org="${esc(o.id)}"><div class="org-top"><span class="monogram">${esc(o.mark)}</span><span class="badge">${esc(o.kind)}</span></div><h3>${esc(o.name)}</h3><small>${o.id==='baiqi'?'公司出差、展覽及內部事項':esc(o.contact)+' · '+esc(o.role)}</small><div class="org-bottom"><span>${records.filter(r=>r.org===o.id||r.relatedOrg===o.id).length} 筆紀錄</span><span>查看檔案</span></div></button>`}
function cards(){const list=organizations.filter(o=>(filter==='全部'||o.kind===filter)&&[o.name,o.contact,o.manager,o.kind].join(' ').toLowerCase().includes(query()));return `<div class="filters">${['全部','內部','飯店','設備商','工程／建築'].map(x=>`<button data-filter="${x}" class="${filter===x?'active':''}">${x}</button>`).join('')}</div><div class="cards">${list.map(orgHTML).join('')}</div>${list.length?'':'<div class="empty">沒有符合的對象，試試其他關鍵字。</div>'}`}
function reminderHTML(owner){return taskListHTML(owner)+'<p class="note">LINE 可傳「查看到期」；每日到期提醒可用「開啟提醒／關閉提醒」調整。</p>'}
function render(){if(nasMode&&!nasReady){$('#content').innerHTML='<div class="empty">登入後即可查看公司資料。</div>';return}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(selected){renderDetail();return}const title={home:'管理總覽',directory:'公司與合作對象',records:'往來紀錄',reminders:'待辦事項'}[view];let h=`<div class="intro"><div><div class="eyebrow" style="margin-bottom:6px">${view==='home'?'OVERVIEW':'RELATIONSHIP MANAGEMENT'}</div><h1>${title}</h1><p class="sub">${view==='home'?'查看待辦進度與日期安排。':'查閱聯絡人、合約、價格與歷史紀錄。'}</p></div>${view==='home'||view==='reminders'?'<button class="primary" data-task-add>＋ 新增待辦</button>':'<button class="primary" data-add>＋ 新增紀錄</button>'}</div><div class="notice"><span class="badge">${nasMode?'NAS':'示範'}</span><span>${nasMode?'資料儲存於 NAS；每20秒同步一次，也可手動重新載入。':'畫面包含示範資料；新增與編輯內容僅儲存於本裝置，目前尚未與公司資料同步。'}</span></div>`;
if(view==='home')h+=taskWorkbench();
if(view==='directory')h+='<div class="org-buttons"><button class="primary" data-org-add>＋ 新增對象</button></div>'+cards();if(view==='records')h+=`<section class="panel record-list">${getRecords().map(eventHTML).join('')||'<div class="empty">沒有符合的紀錄。</div>'}</section>`;if(view==='reminders')h+=taskWorkbench();$('#content').innerHTML=h;bind()}
function renderDetail(){const o=org(selected),rr=getRecords(o.id);let h=`<div class="org-buttons"><button class="back" data-back>返回對象名錄</button><button class="outline" data-org-edit>編輯對象</button></div><div class="detail-head"><span class="monogram">${esc(o.mark)}</span><div><div class="eyebrow">${esc(o.en)}</div><h1>${esc(o.name)}</h1><p class="sub">${esc(o.memo)}</p></div></div><div class="notice"><span class="badge">體驗版</span><span>${nasMode?'公司資料已連接 NAS。':o.id==='baiqi'?'新增內容僅保留於這台裝置，尚未同步 NAS。':'人物、價格與合約資料僅供展示。'}</span></div><div class="tabs" role="tablist" aria-label="公司檔案">${(o.id==='baiqi'?['總覽','行程','時間軸','文件','提醒']:['總覽','聯絡人','合約與價格','客訴','人情往來','行程','時間軸','文件','提醒']).map(t=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}</div>`;
if(tab==='總覽')h+=`<div class="section-title"><h2>${o.id==='baiqi'?'公司紀錄':'合作摘要'}</h2><button class="primary" data-add>＋ 新增紀錄</button></div><section class="panel">${o.id==='baiqi'?'<p>公司出差、展覽與內部事項集中於此。</p>':`<div class="facts"><div class="fact"><label>主要聯絡人</label>${esc(o.contact)} · ${esc(o.role)}</div><div class="fact"><label>經理／負責人</label>${esc(o.manager)}</div><div class="fact"><label>合約期間</label>${esc(o.contract)}</div><div class="fact"><label>往來紀錄</label>${records.filter(r=>r.org===o.id||r.relatedOrg===o.id).length} 筆</div></div>`}</section><div class="columns"><section class="panel"><h2>往來時間軸</h2><div class="timeline">${rr.map(eventHTML).join('')||'<div class="empty">還沒有紀錄。</div>'}</div></section>${o.id==='baiqi'?'':`<section class="panel"><h2>目前價格</h2>${priceTable(o)}</section>`}</div>`;
else if(tab==='聯絡人')h+=`<section class="panel"><div class="facts"><div class="fact"><label>${esc(o.role)}</label>${esc(o.contact)}</div><div class="fact"><label>經理／負責人</label>${esc(o.manager)}</div><div class="fact"><label>電話</label>尚未提供</div><div class="fact"><label>電子郵件</label>尚未提供</div></div></section>`;
else if(tab==='合約與價格')h+=`<section class="panel"><h2>合約期間</h2><p style="margin:15px 0 28px">${esc(o.contract)}</p><h2>現行品項價格</h2>${priceTable(o)}<p class="note">正式串接後將保留每次調價的生效日期與歷史。</p></section>`;
else if(tab==='文件'){const files=rr.filter(r=>r.attachments?.length);h+=`<section class="panel">${files.map(r=>`<div style="margin-bottom:20px"><h3>${esc(r.date)} · ${esc(r.title)}</h3>${attachmentsHTML(r)}</div>`).join('')||'<div class="empty">目前沒有附件。可從 LINE 傳送照片或語音。</div>'}</section>`;}
else if(tab==='提醒')h+=`<div class="section-title"><h2>關聯待辦</h2><button class="primary" data-task-add>＋ 新增待辦</button></div><section class="panel">${reminderHTML(o.id)}</section>`;
else{const filtered=rr.filter(r=>tab==='時間軸'||(tab==='行程'?r.type==='出差／展覽':r.type===tab));h+=`<div class="section-title"><h2>${tab}</h2><button class="primary" data-add>＋ 新增紀錄</button></div>${tab==='人情往來'?`<div class="panel" style="margin-bottom:20px"><span class="muted">人情往來紀錄合計（示範）</span><div class="total">${money(filtered.reduce((a,r)=>a+Number(r.amount||0),0))}</div></div>`:''}<section class="panel record-list">${filtered.map(eventHTML).join('')||'<div class="empty">還沒有這類紀錄。</div>'}</section>`}$('#content').innerHTML=h;bind()}
function priceTable(o){return o.prices.length?`<div class="table-wrap"><table><thead><tr><th>品項</th><th>單價</th><th>生效日</th></tr></thead><tbody>${o.prices.map(p=>`<tr><td>${esc(p[0])}</td><td>${money(p[1])}</td><td>${esc(p[2])}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚未提供價格。</div>'}
function bind(){bindTasks();document.querySelector('[data-org-add]')?.addEventListener('click',()=>openOrg());document.querySelector('[data-org-edit]')?.addEventListener('click',()=>openOrg(selected));document.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{selected=b.dataset.org;tab='總覽';render();window.scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));const back=$('[data-back]');if(back)back.onclick=()=>navigate('directory')}
function navigate(v){view=v;selected=null;selectedDay=null;filter='全部';render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#search').addEventListener('input',render);
function openForm(id){draftSourceText='';editing=id||null;const r=records.find(x=>x.id===id),f=$('#record-form');f.reset();$('#org-select').innerHTML='<option value="">請選擇對象</option>'+organizations.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');f.elements.org.value=r?.org||selected||organizations[0].id;f.elements.date.value=r?.date||today;f.elements.endDate.value=r?.endDate||'';$('#related-org-select').innerHTML='<option value="">無</option>'+organizations.filter(o=>o.id!==f.elements.org.value).map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');f.elements.relatedOrg.value=r?.relatedOrg||'';f.elements.type.value=r?.type||(tab==='人情往來'?'人情往來':tab==='行程'||selected==='baiqi'?'出差／展覽':'一般紀錄');f.elements.title.value=r?.title||'';f.elements.note.value=r?.note||'';f.elements.amount.value=r?.amount??'';$('#form-title').textContent=r?'編輯往來紀錄':'新增往來紀錄';if(nasMode)$('#record-dialog .note').textContent='確認儲存後寫入 NAS。';$('#record-dialog').showModal()}
$('#org-select').addEventListener('change',()=>{const f=$('#record-form'),old=f.elements.relatedOrg.value;$('#related-org-select').innerHTML='<option value="">無</option>'+organizations.filter(o=>o.id!==f.elements.org.value).map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');if(old!==f.elements.org.value)f.elements.relatedOrg.value=old});$('#close-dialog').onclick=$('#cancel-dialog').onclick=()=>$('#record-dialog').close();$('#record-form').elements.endDate.addEventListener('input',e=>e.target.setCustomValidity(''));$('#record-form').onsubmit=async e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const d=new FormData(f),title=d.get('title').trim();if(!title){f.elements.title.focus();return}const endDate=d.get('endDate')||null,relatedOrg=d.get('relatedOrg')||null;if(endDate&&endDate<d.get('date')){f.elements.endDate.setCustomValidity('結束日期不可早於開始日期');f.elements.endDate.reportValidity();return}f.elements.endDate.setCustomValidity('');if(relatedOrg===d.get('org')){notify('關聯對象不能與主要對象相同');return}const amount=d.get('amount')===''?null:Number(d.get('amount'));if(amount!==null&&(!Number.isFinite(amount)||amount<0))return;const r={...(records.find(x=>x.id===editing)||{}),id:editing||newId(),org:d.get('org'),date:d.get('date'),endDate,relatedOrg,type:d.get('type'),title,note:d.get('note').trim(),amount,...(draftSourceText?{sourceText:draftSourceText}:records.find(x=>x.id===editing)?.sourceText?{sourceText:records.find(x=>x.id===editing).sourceText}:{})};const next=editing?records.map(x=>x.id===editing?r:x):[...records,r];try{await persistState({records:next});$('#record-dialog').close();render();notify(nasMode?'紀錄已儲存於 NAS':'已儲存在本裝置 · 尚未同步 NAS')}catch(err){notify(err.message||'儲存失敗，請保留輸入內容並重試。')}};
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'search_company_memory',title:'搜尋公司記憶庫',description:'搜尋目前體驗版的公司與往來紀錄，並更新頁面搜尋結果。',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input.query!=='string')throw new Error('query must be a string');$('#search').value=input.query;selected=null;view='records';render();return{records:getRecords().map(r=>({date:r.date,company:org(r.org)?.name,title:r.title}))}}})).catch(()=>{})}catch{}}startNas();
