function taskMatches(t){return [t.title,t.note,org(t.org)?.name].join(' ').toLowerCase().includes(query())}
function shownTasks(owner){return tasks.filter(t=>(!owner||t.org===owner)&&taskMatches(t)&&(!selectedDay||t.dueDate===selectedDay)&&(taskFilter==='all'||(taskFilter==='done'?t.done:!t.done))).sort((a,b)=>Number(a.done)-Number(b.done)||(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||a.title.localeCompare(b.title,'zh-TW'))}
function taskHTML(t){return `<article class="task-row ${t.done?'done':''}"><input type="checkbox" data-task-toggle="${esc(t.id)}" ${t.done?'checked':''} aria-label="${esc((t.done?'標記未完成：':'標記完成：')+t.title)}"><div class="task-body"><h3>${esc(t.title)}</h3><small class="${!t.done&&t.dueDate&&t.dueDate<today?'task-overdue':''}">${t.dueDate?esc(t.dueDate.replaceAll('-','/')):'未指定日期'}${t.org?' · '+esc(org(t.org)?.name||''):''}${t.done?' · 已完成':''}</small>${t.note?`<p>${esc(t.note)}</p>`:''}</div><button class="task-edit" data-task-edit="${esc(t.id)}">編輯</button></article>`}
function taskListHTML(owner){const list=shownTasks(owner);return `<div class="task-toolbar"><h2>${selectedDay?esc(selectedDay.replaceAll('-','/'))+' 待辦':'待辦事項'}</h2>${selectedDay?'<button class="task-clear" data-clear-day>顯示全部日期</button>':''}</div><div class="task-filters">${[['pending','未完成'],['done','已完成'],['all','全部']].map(([v,label])=>`<button data-task-filter="${v}" class="${taskFilter===v?'active':''}">${label}</button>`).join('')}</div><div class="task-list">${list.map(taskHTML).join('')||'<div class="empty">'+(selectedDay?'這一天沒有符合條件的待辦。':'沒有符合條件的待辦。')+'</div>'}</div>`}
function calendarHTML(){const [year,month]=calendarMonth.split('-').map(Number),first=new Date(Date.UTC(year,month-1,1)).getUTCDay(),days=new Date(Date.UTC(year,month,0)).getUTCDate();const counts={};tasks.filter(t=>!t.done&&t.dueDate&&taskMatches(t)).forEach(t=>counts[t.dueDate]=(counts[t.dueDate]||0)+1);return `<div class="calendar-head"><button data-month="-1" aria-label="上一個月">上一月</button><h2>${year} 年 ${month} 月</h2><button data-month="1" aria-label="下一個月">下一月</button></div><div class="calendar-grid">${['日','一','二','三','四','五','六'].map(w=>`<div class="weekday">${w}</div>`).join('')}${'<div class="calendar-empty" aria-hidden="true"></div>'.repeat(first)}${Array.from({length:days},(_,i)=>{const d=calendarMonth+'-'+String(i+1).padStart(2,'0'),n=counts[d]||0;return `<button class="calendar-day ${d===today?'today':''} ${n?'has-task':''} ${d===selectedDay?'selected':''}" data-day="${d}" aria-pressed="${d===selectedDay}" aria-label="${d}，${n} 件未完成待辦">${i+1}${n?`<span class="task-count">${n}</span>`:''}</button>`}).join('')}</div><div class="calendar-legend"><span><i class="legend-square"></i>有未完成待辦</span><button class="task-clear" data-today>回到本月</button></div><p class="note">點選日期查看當天待辦；未指定日期的事項列在全部日期清單。</p>`}
function taskWorkbench(){return `<div class="task-summary"><div><span>未完成</span><strong>${tasks.filter(t=>!t.done).length}</strong></div><div><span>今日待辦</span><strong>${tasks.filter(t=>!t.done&&t.dueDate===today).length}</strong></div><div><span>未指定日期</span><strong>${tasks.filter(t=>!t.done&&!t.dueDate).length}</strong></div></div><div class="workbench"><section class="panel">${taskListHTML()}</section><section class="panel" aria-label="待辦月曆">${calendarHTML()}</section></div><p class="note">示範待辦可編輯；勾選完成後仍可在「已完成」查看。</p>`}
function bindTasks(){document.querySelectorAll('[data-task-toggle]').forEach(el=>el.onchange=()=>{const next=tasks.map(t=>t.id===el.dataset.taskToggle?{...t,done:el.checked}:t);if(saveTasks(next))render();else el.checked=!el.checked});document.querySelectorAll('[data-task-edit]').forEach(b=>b.onclick=()=>openTask(b.dataset.taskEdit));document.querySelectorAll('[data-task-add]').forEach(b=>b.onclick=()=>openTask());document.querySelectorAll('[data-task-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.taskFilter;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});document.querySelectorAll('[data-clear-day]').forEach(b=>b.onclick=()=>{selectedDay=null;render()});document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{const [y,m]=calendarMonth.split('-').map(Number),d=new Date(Date.UTC(y,m-1+Number(b.dataset.month),1));calendarMonth=d.toISOString().slice(0,7);selectedDay=null;render()});document.querySelectorAll('[data-today]').forEach(b=>b.onclick=()=>{calendarMonth=today.slice(0,7);selectedDay=null;render()})}
function openTask(id){editingTask=id||null;const t=tasks.find(t=>t.id===id),f=$('#task-form');f.reset();$('#task-org-select').innerHTML='<option value="">無</option>'+organizations.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');f.elements.title.value=t?.title||'';f.elements.dueDate.value=t?.dueDate||selectedDay||'';f.elements.org.value=t?.org||selected||'';f.elements.note.value=t?.note||'';$('#task-form-title').textContent=t?'編輯待辦':'新增待辦';$('#task-dialog').showModal()}
$('#close-task').onclick=$('#cancel-task').onclick=()=>$('#task-dialog').close();$('#task-form').onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const d=new FormData(f),title=d.get('title').trim();if(!title){f.elements.title.focus();return}const previous=tasks.find(t=>t.id===editingTask),item={id:editingTask||crypto.randomUUID(),title,dueDate:d.get('dueDate')||null,org:d.get('org')||null,note:d.get('note').trim(),done:previous?.done||false};const next=editingTask?tasks.map(t=>t.id===editingTask?item:t):[...tasks,item];if(saveTasks(next)){$('#task-dialog').close();if(taskFilter==='done'&&!item.done)taskFilter='pending';if(selectedDay&&item.dueDate!==selectedDay)selectedDay=null;render();notify('待辦已儲存於本裝置')}};
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function getRecords(id){return records.filter(r=>(!id||r.org===id||r.relatedOrg===id)&&[r.title,r.note,r.type,org(r.org)?.name,org(r.relatedOrg)?.name].join(' ').toLowerCase().includes(query())).sort((a,b)=>b.date.localeCompare(a.date))}
function eventHTML(r){return `<article class="event"><time datetime="${esc(r.date)}">${esc(r.date.slice(5).replace('-','/'))}${r.endDate?' — '+esc(r.endDate.slice(5).replace('-','/')):''}<div class="eyebrow">${esc(r.date.slice(0,4))}</div></time><div class="event-body"><span class="badge">${esc(r.type)}</span><h3 style="margin-top:7px">${esc(r.title)}</h3><p>${esc(org(r.org)?.name)}${r.relatedOrg?' · 關聯：'+esc(org(r.relatedOrg)?.name):''}${r.amount!=null?' · '+money(r.amount):''}</p><p>${esc(r.note)}</p><button data-edit="${esc(r.id)}">編輯紀錄</button></div></article>`}
function orgHTML(o){return `<button class="org" data-org="${o.id}"><div class="org-top"><span class="monogram">${o.mark}</span><span class="badge">${o.kind}</span></div><h3>${o.name}</h3><small>${o.id==='baiqi'?'公司出差、展覽及內部事項':o.contact+' · '+o.role}</small><div class="org-bottom"><span>${records.filter(r=>r.org===o.id||r.relatedOrg===o.id).length} 筆紀錄</span><span>查看檔案</span></div></button>`}
function cards(){const list=organizations.filter(o=>(filter==='全部'||o.kind===filter)&&[o.name,o.contact,o.manager,o.kind].join(' ').toLowerCase().includes(query()));return `<div class="filters">${['全部','內部','飯店','設備商','工程／建築'].map(x=>`<button data-filter="${x}" class="${filter===x?'active':''}">${x}</button>`).join('')}</div><div class="cards">${list.map(orgHTML).join('')}</div>${list.length?'':'<div class="empty">沒有符合的對象，試試其他關鍵字。</div>'}`}
function reminderHTML(owner){return taskListHTML(owner)+'<p class="note">尚未啟用 LINE 自動通知。</p>'}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(selected){renderDetail();return}const title={home:'管理總覽',directory:'公司與合作對象',records:'往來紀錄',reminders:'待辦事項'}[view];let h=`<div class="intro"><div><div class="eyebrow" style="margin-bottom:6px">${view==='home'?'OVERVIEW':'RELATIONSHIP MANAGEMENT'}</div><h1>${title}</h1><p class="sub">${view==='home'?'查看待辦進度與日期安排。':'查閱聯絡人、合約、價格與歷史紀錄。'}</p></div>${view==='home'||view==='reminders'?'<button class="primary" data-task-add>＋ 新增待辦</button>':'<button class="primary" data-add>＋ 新增紀錄</button>'}</div><div class="notice"><span class="badge">示範</span><span>畫面包含示範資料；新增與編輯內容僅儲存於本裝置，目前尚未與公司資料同步。</span></div>`;
if(view==='home')h+=taskWorkbench();
if(view==='directory')h+=cards();if(view==='records')h+=`<section class="panel record-list">${getRecords().map(eventHTML).join('')||'<div class="empty">沒有符合的紀錄。</div>'}</section>`;if(view==='reminders')h+=taskWorkbench();$('#content').innerHTML=h;bind()}
function renderDetail(){const o=org(selected),rr=getRecords(o.id);let h=`<button class="back" data-back>返回對象名錄</button><div class="detail-head"><span class="monogram">${o.mark}</span><div><div class="eyebrow">${o.en}</div><h1>${o.name}</h1><p class="sub">${o.memo}</p></div></div><div class="notice"><span class="badge">體驗版</span><span>${o.id==='baiqi'?'新增內容僅保留於這台裝置，尚未同步 NAS。':'人物、價格與合約資料僅供展示。'}</span></div><div class="tabs" role="tablist" aria-label="公司檔案">${(o.id==='baiqi'?['總覽','行程','時間軸','文件','提醒']:['總覽','聯絡人','合約與價格','客訴','人情往來','行程','時間軸','文件','提醒']).map(t=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}</div>`;
if(tab==='總覽')h+=`<div class="section-title"><h2>${o.id==='baiqi'?'公司紀錄':'合作摘要'}</h2><button class="primary" data-add>＋ 新增紀錄</button></div><section class="panel">${o.id==='baiqi'?'<p>公司出差、展覽與內部事項集中於此。</p>':`<div class="facts"><div class="fact"><label>主要聯絡人</label>${o.contact} · ${o.role}</div><div class="fact"><label>經理／負責人</label>${o.manager}</div><div class="fact"><label>合約期間</label>${o.contract}</div><div class="fact"><label>往來紀錄</label>${records.filter(r=>r.org===o.id||r.relatedOrg===o.id).length} 筆</div></div>`}</section><div class="columns"><section class="panel"><h2>往來時間軸</h2><div class="timeline">${rr.map(eventHTML).join('')||'<div class="empty">還沒有紀錄。</div>'}</div></section>${o.id==='baiqi'?'':`<section class="panel"><h2>目前價格</h2>${priceTable(o)}</section>`}</div>`;
else if(tab==='聯絡人')h+=`<section class="panel"><div class="facts"><div class="fact"><label>${o.role}</label>${o.contact}</div><div class="fact"><label>經理／負責人</label>${o.manager}</div><div class="fact"><label>電話</label>尚未提供</div><div class="fact"><label>電子郵件</label>尚未提供</div></div></section>`;
else if(tab==='合約與價格')h+=`<section class="panel"><h2>合約期間</h2><p style="margin:15px 0 28px">${o.contract}</p><h2>現行品項價格</h2>${priceTable(o)}<p class="note">正式串接後將保留每次調價的生效日期與歷史。</p></section>`;
else if(tab==='文件')h+=`<section class="panel empty">目前沒有文件。<p class="note">NAS 串接完成後，這裡會顯示合約、報價單與照片。</p></section>`;
else if(tab==='提醒')h+=`<div class="section-title"><h2>關聯待辦</h2><button class="primary" data-task-add>＋ 新增待辦</button></div><section class="panel">${reminderHTML(o.id)}</section>`;
else{const filtered=rr.filter(r=>tab==='時間軸'||(tab==='行程'?r.type==='出差／展覽':r.type===tab));h+=`<div class="section-title"><h2>${tab}</h2><button class="primary" data-add>＋ 新增紀錄</button></div>${tab==='人情往來'?`<div class="panel" style="margin-bottom:20px"><span class="muted">人情往來紀錄合計（示範）</span><div class="total">${money(filtered.reduce((a,r)=>a+Number(r.amount||0),0))}</div></div>`:''}<section class="panel record-list">${filtered.map(eventHTML).join('')||'<div class="empty">還沒有這類紀錄。</div>'}</section>`}$('#content').innerHTML=h;bind()}
function priceTable(o){return o.prices.length?`<div class="table-wrap"><table><thead><tr><th>品項</th><th>單價</th><th>生效日</th></tr></thead><tbody>${o.prices.map(p=>`<tr><td>${p[0]}</td><td>${money(p[1])}</td><td>${p[2]}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚未提供價格。</div>'}
function bind(){bindTasks();document.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{selected=b.dataset.org;tab='總覽';render();window.scrollTo(0,0)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));const back=$('[data-back]');if(back)back.onclick=()=>navigate('directory')}
function navigate(v){view=v;selected=null;selectedDay=null;filter='全部';render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#search').addEventListener('input',render);
function openForm(id){editing=id||null;const r=records.find(x=>x.id===id),f=$('#record-form');f.reset();$('#org-select').innerHTML=organizations.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');f.elements.org.value=r?.org||selected||organizations[0].id;f.elements.date.value=r?.date||today;f.elements.endDate.value=r?.endDate||'';$('#related-org-select').innerHTML='<option value="">無</option>'+organizations.filter(o=>o.id!==f.elements.org.value).map(o=>`<option value="${o.id}">${o.name}</option>`).join('');f.elements.relatedOrg.value=r?.relatedOrg||'';f.elements.type.value=r?.type||(tab==='人情往來'?'人情往來':tab==='行程'||selected==='baiqi'?'出差／展覽':'一般紀錄');f.elements.title.value=r?.title||'';f.elements.note.value=r?.note||'';f.elements.amount.value=r?.amount??'';$('#form-title').textContent=r?'編輯往來紀錄':'新增往來紀錄';$('#record-dialog').showModal()}
$('#org-select').addEventListener('change',()=>{const f=$('#record-form'),old=f.elements.relatedOrg.value;$('#related-org-select').innerHTML='<option value="">無</option>'+organizations.filter(o=>o.id!==f.elements.org.value).map(o=>`<option value="${o.id}">${o.name}</option>`).join('');if(old!==f.elements.org.value)f.elements.relatedOrg.value=old});$('#close-dialog').onclick=$('#cancel-dialog').onclick=()=>$('#record-dialog').close();$('#record-form').elements.endDate.addEventListener('input',e=>e.target.setCustomValidity(''));$('#record-form').onsubmit=e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const d=new FormData(f),title=d.get('title').trim();if(!title){f.elements.title.focus();return}const endDate=d.get('endDate')||null,relatedOrg=d.get('relatedOrg')||null;if(endDate&&endDate<d.get('date')){f.elements.endDate.setCustomValidity('結束日期不可早於開始日期');f.elements.endDate.reportValidity();return}f.elements.endDate.setCustomValidity('');if(relatedOrg===d.get('org')){notify('關聯對象不能與主要對象相同');return}const amount=d.get('amount')===''?null:Number(d.get('amount'));if(amount!==null&&(!Number.isFinite(amount)||amount<0))return;const r={id:editing||crypto.randomUUID(),org:d.get('org'),date:d.get('date'),endDate,relatedOrg,type:d.get('type'),title,note:d.get('note').trim(),amount};const next=editing?records.map(x=>x.id===editing?r:x):[...records,r];try{localStorage.setItem('company-memory-trial-v1',JSON.stringify(next));records=next;$('#record-dialog').close();render();notify('已儲存在本裝置 · 尚未同步 NAS')}catch{notify('裝置儲存失敗，請保留輸入內容並重試。')}};
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'search_company_memory',title:'搜尋公司記憶庫',description:'搜尋目前體驗版的公司與往來紀錄，並更新頁面搜尋結果。',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input.query!=='string')throw new Error('query must be a string');$('#search').value=input.query;selected=null;view='records';render();return{records:getRecords().map(r=>({date:r.date,company:org(r.org)?.name,title:r.title}))}}})).catch(()=>{})}catch{}}render();
</script></body></html>
