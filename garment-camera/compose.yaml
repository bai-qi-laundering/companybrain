services:
  garment-camera:
    build: .
    restart: unless-stopped
    environment:
      COMPANYBRAIN_URL: ${COMPANYBRAIN_URL}
      CAMERA_API_KEY: ${CAMERA_API_KEY}
      CAMERA_HOST: ${CAMERA_HOST:-192.168.1.87}
      CAMERA_ONVIF_PORT: ${CAMERA_ONVIF_PORT:-8087}
      CAMERA_USERNAME: ${CAMERA_USERNAME:?Please set camera username}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:?Please set camera password}
      PHOTO_DIR: /data/photos
      TABLET_BIND: 0.0.0.0
      TABLET_PORT: "8790"
      TABLET_PATH_PREFIX: ${TABLET_PATH_PREFIX:-}
    volumes:
      - ./data:/data
    ports:
      # LAN NIC only, plus loopback for a local Tailscale Funnel proxy.
      # Do not publish this port on a Tailscale or public address.
      - "192.168.123.201:8790:8790"
      - "127.0.0.1:8790:8790"
